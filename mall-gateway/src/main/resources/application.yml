server:
  port: 8201
spring:
  application:
    name: mall-gateway
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true #Use lowercase service-id
          routes: #Configure route paths
            - id: mall-auth
              uri: lb://mall-auth
              predicates:
                - Path=/mall-auth/**
              filters:
                - StripPrefix=1
            - id: mall-admin
              uri: lb://mall-admin
              predicates:
                - Path=/mall-admin/**
              filters:
                - StripPrefix=1
            - id: mall-portal
              uri: lb://mall-portal
              predicates:
                - Path=/mall-portal/**
              filters:
                - StripPrefix=1
            - id: mall-search
              uri: lb://mall-search
              predicates:
                - Path=/mall-search/**
              filters:
                - StripPrefix=1
            - id: mall-demo
              uri: lb://mall-demo
              predicates:
                - Path=/mall-demo/**
              filters:
                - StripPrefix=1
  data:
    redis:
      database: 0
      port: 6379
      host: localhost
      password:
secure:
  ignore:
    urls: #Configure whitelist paths
      - "/doc.html"
      - "/v3/api-docs/swagger-config"
      - "/*/v3/api-docs/default"
      - "/*/v3/api-docs"
      - "/*/swagger-ui/**"
      - "/webjars/**"
      - "/favicon.ico"
      - "/webjars/**"
      - "/actuator/**"
      - "/mall-auth/**"
      - "/mall-search/**"
      - "/mall-portal/sso/login"
      - "/mall-portal/sso/register"
      - "/mall-portal/sso/getAuthCode"
      - "/mall-portal/home/**"
      - "/mall-portal/product/**"
      - "/mall-portal/brand/**"
      - "/mall-portal/alipay/**"
      - "/mall-admin/admin/login"
      - "/mall-admin/admin/register"
      - "/mall-admin/minio/upload"
management:
  endpoints:
    web:
      exposure:
        include: '*' #Expose Actuator monitoring endpoints
  endpoint:
    health:
      show-details: always #Show detailed health information
    env:
      show-values: always # Actuator environment variables are masked (****) by default; show real values here
    configprops:
      show-values: always # Actuator configuration properties are masked (****) by default; show real values here
    info:
      access: read-only
knife4j:
  gateway:
    enabled: true
    strategy: discover #Gateway documentation aggregation: service discovery (automatic aggregation)
    discover:
      version: openapi3 #Configure the OpenAPI3 specification
      enabled: true #Configure enabling service discovery
      excluded-services: mall-monitor #Exclude the monitoring service
    tags-sorter: order #Configure tag sort rules
    operations-sorter: order #Configure operation sort rules
sa-token:
  # token Name (Also the cookie name)
  token-name: Authorization
  # token Validity period in seconds, -1 means never expires
  timeout: 2592000
  # token Temporary validity period (Token is considered expired if no operation within the specified time), in seconds
  active-timeout: -1
  # Whether the same account may log in concurrently (When false, a new login kicks out the old login)
  is-concurrent: true
  # Whether multiple logins on the same account share one token (When false, a new one is created for each login token)
  is-share: false
  # token Style
  token-style: uuid
  # Whether to output operation logs
  is-log: false
  # Whether to read from cookie token
  is-read-cookie: false
  # Whether to read from header token
  is-read-header: true
  # token Prefix
  token-prefix: Bearer
  # Whether to print banner
  is-print: false
