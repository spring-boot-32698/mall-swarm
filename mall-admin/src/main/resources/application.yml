server:
  port: 8080
spring:
  application:
    name: mall-admin
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    druid:
      initial-size: 5 #Connection pool initial size
      min-idle: 10 #Minimum idle connections
      max-active: 20 #Maximum connections
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #Do not count these request data
      stat-view-servlet: #Login username and password for accessing the monitoring web page
        login-username: druid
        login-password: druid
  data:
    redis:
      host: localhost # Redis Server address
      database: 0 # Redis Database index (default 0)
      port: 6379 # Redis Server connection port
      password:  # Redis Server connection password (empty by default)
      timeout: 3000ms # Connection timeout (milliseconds)
  servlet:
    multipart:
      enabled: true #Enable file upload
      max-file-size: 10MB #Limit the file upload size to 10M
mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml
management:
  endpoints:
    web:
      exposure:
        include: '*' #Expose Actuator monitoring endpoints
  endpoint:
    health:
      show-details: always #Show detailed health information
    env:
      show-values: always # Actuator environment variables are masked (****) by default; show real values here
    configprops:
      show-values: always # Actuator configuration properties are masked (****) by default; show real values here
    info:
      access: read-only
redis:
  database: mall-swarm
  key:
    admin: 'ums:admin'
  expire:
    common: 86400 # 24 hours
aliyun:
  oss:
    endpoint: oss-cn-shenzhen.aliyuncs.com # oss Access domain name for external services
    accessKeyId: test # User identifier used in access identity authentication
    accessKeySecret: test # Secret key used by the user to encrypt the signature string and by OSS to verify it
    bucketName: macro-oss # oss storage space
    policy:
      expire: 300 # Signature validity period(S)
    maxSize: 10 # Upload file size(M)
    callback: http://39.98.190.128:8080/aliyun/oss/callback # Callback URL after file upload succeeds
    dir:
      prefix: mall/images/ # Upload folder path prefix
minio:
  endpoint: http://localhost:9000 #MinIO Service address
  bucketName: mall #Bucket name
  accessKey: minioadmin #Access key
  secretKey: minioadmin #Access secret key
springdoc:
  swagger-ui:
    # Modify Swagger UI path
    path: /swagger-ui.html
    # Enable Swagger UI
    enabled: true
    # Configures how tags and operations are expanded; here neither is expanded
    doc-expansion: 'none'
  api-docs:
    # Modify api-docs path
    path: /v3/api-docs
    # Enable api-docs
    enabled: true
  group-configs:
    - group: 'default'
      packages-to-scan: com.macro.mall.controller
  default-flat-param-object: false
sa-token:
  # token Name (Also the cookie name)
  token-name: Authorization
  # token Validity period in seconds, -1 means never expires
  timeout: 604800
  # token Temporary validity period (Token is considered expired if no operation within the specified time), in seconds
  active-timeout: -1
  # Whether the same account may log in concurrently (When false, a new login kicks out the old login)
  is-concurrent: true
  # Whether multiple logins on the same account share one token (When false, a new one is created for each login token)
  is-share: false
  # token Style
  token-style: uuid
  # Whether to output operation logs
  is-log: false
  # Whether to read from cookie token
  is-read-cookie: false
  # Whether to read from header token
  is-read-header: true
  # token Prefix
  token-prefix: Bearer
  # jwt Secret key
  jwt-secret-key: sa-secret-key123
  # Whether to print banner
  is-print: false
logstash:
  host: localhost
  enableInnerLog: true