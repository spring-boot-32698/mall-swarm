server:
  port: 8081
spring:
  application:
    name: mall-search
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    druid:
      initial-size: 5 #Connection pool initial size
      min-idle: 10 #Minimum idle connections
      max-active: 20 #Maximum connections
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #Do not count these request data
      stat-view-servlet: #Login username and password for accessing the monitoring web page
        login-username: druid
        login-password: druid
  data:
    elasticsearch:
      repositories:
        enabled: true
  elasticsearch:
    uris: localhost:9200
mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml
management:
  endpoints:
    web:
      exposure:
        include: '*' #Expose Actuator monitoring endpoints
  health:
    elasticsearch:
      enabled: false
  endpoint:
    health:
      show-details: always #Show detailed health information
    env:
      show-values: always # Actuator environment variables are masked (****) by default; show real values here
    configprops:
      show-values: always # Actuator configuration properties are masked (****) by default; show real values here
    info:
      access: read-only
springdoc:
  swagger-ui:
    # Modify Swagger UI path
    path: /swagger-ui.html
    # Enable Swagger UI
    enabled: true
    # Configures how tags and operations are expanded; here neither is expanded
    doc-expansion: 'none'
  api-docs:
    # Modify api-docs path
    path: /v3/api-docs
    # Enable api-docs
    enabled: true
  group-configs:
    - group: 'mall-search'
      packages-to-scan: com.macro.mall.search.controller



