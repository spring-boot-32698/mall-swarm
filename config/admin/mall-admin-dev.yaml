aliyun:
  oss:
    endpoint: oss-cn-shenzhen.aliyuncs.com # oss Access domain name for external services
    accessKeyId: test # User identifier used in access identity authentication
    accessKeySecret: test # Secret key used by the user to encrypt the signature string and by OSS to verify it
    bucketName: macro-oss # oss storage space
    policy:
      expire: 300 # Signature validity period(S)
    maxSize: 10 # Upload file size(M)
    callback: http://39.98.190.128:8080/aliyun/oss/callback # Callback URL after file upload succeeds
    dir:
      prefix: mall/images/ # Upload folder path prefix
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
  data:
    redis:
      host: localhost # Redis Server address
      database: 0 # Redis Database index (default 0)
      port: 6379 # Redis Server connection port
      password: # Redis Server connection password (empty by default)
      timeout: 3000ms # Connection timeout (milliseconds)
minio:
  endpoint: http://localhost:9000 #MinIO Service address
  bucketName: mall #Bucket name
  accessKey: minioadmin #Access key
  secretKey: minioadmin #Access secret key
logging:
  level:
    root: info
    com.macro.mall: debug
logstash:
  host: localhost
  enableInnerLog: false