# mall-swarm: backend microservices and the infrastructure they depend on.
#
#   docker compose up -d --build
#
# Gateway:  http://localhost:8201  
# Nacos:    http://localhost:8848/nacos (nacos / nacos)
# Monitor:  http://localhost:8101 (macro / 123456)
# Other compose projects (mall-admin-web, mall-app-web) join the "mall" network
# and talk to the gateway; this file creates that network.

name: mall

x-app: &app
  restart: unless-stopped
  environment:
    TZ: Asia/Shanghai
    JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
  volumes:
    - app-logs:/var/logs
  networks: [mall]

services:
  # ---------- infrastructure ----------
  # Service names double as the host names used in config/*/*-prod.yaml
  # (db, redis, mongo, rabbit, es, nacos-registry).
  db:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mall
      TZ: Asia/Shanghai
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/01-users.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
      - ./document/sql/mall.sql:/docker-entrypoint-initdb.d/02-mall.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    networks: [mall]

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    networks: [mall]

  mongo:
    image: mongo:4
    container_name: mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    networks: [mall]

  rabbit:
    image: rabbitmq:3.9.11-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: mall
      RABBITMQ_DEFAULT_PASS: mall
      RABBITMQ_DEFAULT_VHOST: /mall
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20
      start_period: 20s
    networks: [mall]

  es:
    build: ./docker/elasticsearch
    image: mall/elasticsearch-ik:7.17.3
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      cluster.name: elasticsearch
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx1024m
    ports: ["9200:9200", "9300:9300"]
    volumes: [es-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 30
      start_period: 30s
    networks: [mall]

  nacos-registry:
    image: nacos/nacos-server:v2.1.0
    container_name: nacos-registry
    restart: unless-stopped
    environment:
      MODE: standalone
    ports: ["8848:8848"]
    volumes: [nacos-data:/home/nacos/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 5s
      retries: 40
      start_period: 20s
    networks: [mall]

  # One-shot job: loads config/*/*-prod.yaml into Nacos (config center)
  nacos-init:
    image: curlimages/curl:8.8.0
    entrypoint: ["sh", "/publish.sh"]
    environment:
      NACOS_ADDR: nacos-registry:8848
    volumes:
      - ./docker/nacos-init/publish.sh:/publish.sh:ro
      - ./docker/nacos-init/extra:/extra:ro
      - ./config:/configs:ro
    depends_on:
      nacos-registry: {condition: service_healthy}
    restart: "no"
    networks: [mall]

  # ---------- applications ----------
  mall-auth:
    <<: *app
    image: mall/mall-auth:1.0-SNAPSHOT
    container_name: mall-auth
    build: {context: ., args: {MODULE: mall-auth}}
    ports: ["8401:8401"]
    depends_on:
      nacos-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  mall-admin:
    <<: *app
    image: mall/mall-admin:1.0-SNAPSHOT
    container_name: mall-admin
    build: {context: ., args: {MODULE: mall-admin}}
    ports: ["8080:8080"]
    depends_on:
      nacos-init: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  mall-portal:
    <<: *app
    image: mall/mall-portal:1.0-SNAPSHOT
    container_name: mall-portal
    build: {context: ., args: {MODULE: mall-portal}}
    ports: ["8085:8085"]
    depends_on:
      nacos-init: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbit: {condition: service_healthy}
      mongo: {condition: service_started}

  mall-search:
    <<: *app
    image: mall/mall-search:1.0-SNAPSHOT
    container_name: mall-search
    build: {context: ., args: {MODULE: mall-search}}
    ports: ["8081:8081"]
    depends_on:
      nacos-init: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      es: {condition: service_healthy}

  mall-gateway:
    <<: *app
    image: mall/mall-gateway:1.0-SNAPSHOT
    container_name: mall-gateway
    build: {context: ., args: {MODULE: mall-gateway}}
    ports: ["8201:8201"]
    depends_on:
      nacos-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  mall-monitor:
    <<: *app
    image: mall/mall-monitor:1.0-SNAPSHOT
    container_name: mall-monitor
    build: {context: ., args: {MODULE: mall-monitor}}
    ports: ["8101:8101"]
    depends_on:
      nacos-registry: {condition: service_healthy}

volumes:
  mysql-data:
  redis-data:
  mongo-data:
  rabbitmq-data:
  es-data:
  nacos-data:
  app-logs:

networks:
  mall:
    name: mall
