server:
  port: 8401
spring:
  application:
    name: mall-auth
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
management:
  endpoints:
    web:
      exposure:
        include: '*' #Expose Actuator monitoring endpoints
  endpoint:
    health:
      show-details: always #Show detailed health information
    env:
      show-values: always # Actuator environment variables are masked (****) by default; show real values here
    configprops:
      show-values: always # Actuator configuration properties are masked (****) by default; show real values here
    info:
      access: read-only
springdoc:
  swagger-ui:
    # Modify Swagger UI path
    path: /swagger-ui.html
    # Enable Swagger UI
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    show-extensions: true
  api-docs:
    # Modify api-docs path
    path: /v3/api-docs
    # Enable api-docs
    enabled: true
  group-configs:
    - group: 'default'
      packages-to-scan: com.macro.mall.auth.controller
  default-flat-param-object: false
